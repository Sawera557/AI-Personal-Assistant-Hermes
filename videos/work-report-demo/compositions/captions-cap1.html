<div id="cap1-box" class="cap"><span class="cp" id="cap1-0">A founder running businesses in Kenya and</span><span class="cp" id="cap1-1">the US was keeping rent,</span><span class="cp" id="cap1-2">farm operations, a spa,</span><span class="cp" id="cap1-3">and dozens of bills alive by hand,</span><span class="cp" id="cap1-4">in spreadsheets.</span><span class="cp" id="cap1-5">I turned that into systems that update</span><span class="cp" id="cap1-6">themselves, check their own work,</span><span class="cp" id="cap1-7">and report on live dashboards.</span><span class="cp" id="cap1-8">And along the way,</span><span class="cp" id="cap1-9">I cut about <span class="cn">$33,000</span> a year in</span><span class="cp" id="cap1-10">recurring costs.</span><span class="cp" id="cap1-11">Every system follows the same pattern.</span><span class="cp" id="cap1-12">Source data comes in.</span><span class="cp" id="cap1-13">An automation verifies or processes it.</span><span class="cp" id="cap1-14">It lands in a Google Sheet that</span><span class="cp" id="cap1-15">stays the source of truth.</span><span class="cp" id="cap1-16">A live dashboard reads from that sheet.</span><span class="cp" id="cap1-17">And a person only steps in when</span><span class="cp" id="cap1-18">a real decision is needed.</span><span class="cp" id="cap1-19">Eight scheduled tasks across five businesses,</span><span class="cp" id="cap1-20">and all of them start from one</span><span class="cp" id="cap1-21">place.</span><span class="cp" id="cap1-22">Every dashboard, one door.</span><span class="cp" id="cap1-23">GIF Properties tracks rent,</span><span class="cp" id="cap1-24">arrears and utilities.</span><span class="cp" id="cap1-25">Two weekly automations split the work.</span><span class="cp" id="cap1-26">The Updater records rent payments,</span><span class="cp" id="cap1-27">rolls arrears forward,</span><span class="cp" id="cap1-28">and refreshes utility readings and tenant status.</span></div>
