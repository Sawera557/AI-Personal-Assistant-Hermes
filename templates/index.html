<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0b0e14" />
  <title>Hermes AI Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="app" id="app">
    <div class="overlay" id="overlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">⚡</div>
        <div>
          <h1>Hermes</h1>
          <p class="tag">AI Agent</p>
        </div>
        <button class="drawer-close" id="drawer-close" aria-label="Close menu">✕</button>
      </div>

      <div class="panel">
        <h2>Model</h2>
        <code class="model">{{ model }}</code>
      </div>

      <details class="panel apps-panel">
        <summary>
          <span class="apps-title">Connected apps</span>
          <span class="badge">{{ apps|length }}</span>
          <svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </summary>
        <div class="apps-body">
          <ul class="apps">
            {% for a in apps %}<li>{{ a }}</li>{% endfor %}
          </ul>
          <div class="connect-row">
            <input id="connect-app" placeholder="app slug e.g. quickbooks" autocomplete="off" />
            <button id="connect-btn" title="Get OAuth link">Connect</button>
          </div>
          <p id="connect-result" class="hint"></p>
        </div>
      </details>

      <div class="panel push-bottom">
        <button id="reset-btn" class="ghost">＋ New conversation</button>
        {% if web_search %}<p class="hint">🌐 Web search enabled</p>{% endif %}
      </div>
    </aside>

    <main class="chat">
      <header class="topbar">
        <button class="icon-btn" id="menu-btn" aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>
        <div class="topbar-brand"><span class="logo-sm">⚡</span> Hermes</div>
        <button class="icon-btn plus" id="reset-top" aria-label="New conversation">＋</button>
      </header>

      <div id="messages" class="messages">
        <div class="msg assistant">
          <div class="bubble">Hi! I'm connected to your business apps. How can I help you?</div>
        </div>
      </div>

      <form id="composer" class="composer">
        <div id="attachments" class="attachments"></div>
        <div class="composer-row">
          <label class="attach-btn" title="Attach files" aria-label="Attach files">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            <input id="file-input" type="file" multiple hidden />
          </label>
          <textarea id="input" rows="1" placeholder="Message Hermes…"></textarea>
          <button id="send-btn" type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </form>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.min.js"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
